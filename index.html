<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模擬問題自動作成プロンプト｜情報セキュリティマネジメント学習ツール</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Yu Gothic", "游ゴシック", YuGothic, "游ゴシック体", "Hiragino Sans", "Meiryo", sans-serif; }
    body { padding: 24px 20px 40px; max-width: 1100px; margin: 0 auto; background: #faf6f0; color: #3b3027; }
    h2 {
      text-align: center;
      margin: 10px 0 32px;
      padding-bottom: 16px;
      color: #3b3027;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.5;
      letter-spacing: 1px;
      border-bottom: 3px double #d9c3a5;
    }

    .usage-note {
      background: #fff;
      border: 1px solid #e6d8c3;
      border-left: 5px solid #d9a86c;
      padding: 18px 20px;
      margin-bottom: 30px;
      border-radius: 4px;
      color: #3b3027;
      line-height: 1.9;
      font-size: 15px;
    }

    .chapter-block {
      background: #fff;
      padding: 24px;
      margin-bottom: 22px;
      border: 1px solid #e6d8c3;
      border-radius: 6px;
      box-shadow: 0 1px 3px rgba(90,62,43,0.06);
    }
    .chapter-title {
      font-size: 18px;
      font-weight: 700;
      color: #3b3027;
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid #ecdcc3;
    }
    .button-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .menu-btn {
      display: block;
      padding: 15px 12px;
      font-size: 15px;
      font-weight: 700;
      border: 1px solid #dcb98a;
      border-radius: 6px;
      background: #fcebd3;
      color: #5a4128;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .menu-btn:hover {
      background: #f8dbb4;
      border-color: #c99a60;
    }
    .menu-btn:focus-visible, .tip-btn:focus-visible {
      outline: 3px solid #b9832f;
      outline-offset: 2px;
    }

    .tip-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 15px 12px;
      font-size: 15px;
      font-weight: 700;
      border: 1px solid #cdb9a0;
      border-radius: 6px;
      background: #f3ece3;
      color: #5a4128;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .tip-btn:hover { background: #eadfd0; border-color: #b9a48a; }

    .button-row.four { grid-template-columns: repeat(4, 1fr); }

    @media (max-width: 600px) {
      .button-row, .button-row.four { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 400px) {
      .button-row, .button-row.four { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h2>情報セキュリティマネジメント試験<br>理解度確認ツール</h2>

  <div class="usage-note">
    <strong>使い方</strong><br>
    1. 理解度を測りたい科目のボタンをクリック<br>
    2. 「プロンプトをコピーする」ボタンを押す<br>
    3. AIアプリに貼り付けて実行してください
  </div>

  <!-- 科目A -->
  <div class="chapter-block">
    <div class="chapter-title">シラバス用語リスト　科目A</div>
    <div class="button-row four">
      <a href="科目A①.html" class="menu-btn">その①</a>
      <a href="科目A②.html" class="menu-btn">その②</a>
      <a href="科目A③.html" class="menu-btn">その③</a>
      <a href="科目A④.html" class="menu-btn">その④</a>
    </div>
  </div>

  <!-- 科目B -->
  <div class="chapter-block">
    <div class="chapter-title">シラバス用語リスト　科目B</div>
    <div class="button-row four">
      <a href="科目B①.html" class="menu-btn">その①</a>
      <a href="科目B②.html" class="menu-btn">その②</a>
    </div>
  </div>

  <!-- コツ -->
  <button type="button" class="tip-btn" onclick="showTip()">AIがプロンプト通りに動いてくれないとき</button>

  <script>
    function showTip() {
      alert(
        '【プロンプトが追従されない場合のコツ】\n' +
        '\n' +
        'プロンプト通りに実行されない場合は、都度入力して指示を出してください。\n' +
        '\n' +
        '(例)\n' +
        '・次の問題を出して\n' +
        '・問題は１問ずつ出題して\n' +
        '・解説がありません\n' +
        '・プロンプトを遵守してください\n' +
        '\n' +
        '※何度指摘しても変わらない不備がありましたら、プロンプトを再度\n' +
        '　修正対応しますので、ご連絡ください。\n' +
        '\n' +
        '・各社AIアプリによるプロンプトの理解度について\n' +
        '\n' +
        '複数の理由により、AIアプリ（モデル）によって差（個性）があります。\n' +
        'AIアプリによって得意・不得意があるということです。\n' +
        '各プロンプトを見ていただいたら分かるように、条件分岐や構造が\n' +
        '複雑な命令になっています。\n' +
        '人間側がどれだけ理想的な指示を盛り込むかより、AIが確実にミスなく\n' +
        'こなせる「シンプルさ」を基準に設計するほうが、望む結果になりがち\n' +
        'です。理想的な複雑な指示とAIが理解できる指示のギリギリを狙って\n' +
        '作成していますので、同じAIでも追従指示の精度に差が出る結果に\n' +
        'なります。ご了承ください。'
      );
    }
  </script>

</body>
</html>
